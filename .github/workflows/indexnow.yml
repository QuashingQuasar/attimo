# After each successful production deploy (Vercel reports it to GitHub as a
# deployment status), submit the pages whose text changed to IndexNow.
name: IndexNow

on:
  deployment_status:

jobs:
  indexnow:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      # Give the domain a moment to point at the new deployment.
      - run: sleep 60
      - run: node scripts/indexnow.mjs --state .indexnow-state.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
