<svg viewBox="0 0 720 340" width="720" height="340" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="ttl desc">
<title id="ttl">Olive oil ages in two stages</title>
<desc id="desc">Timeline from the harvest for unopened olive oil kept cool in dark glass or a tin. Up to about 12 months it is at its best: fresh, bitter and peppery, with polyphenols at their peak. From about 12 to 24 months it is past its best: safe to eat and cook with, but flatter and with fewer polyphenols. Much later it turns rancid, smelling of crayons or putty, and is better thrown away. Rancidity has no fixed date; heat, light and air bring it forward.</desc>
<defs><linearGradient id="rancid" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#1B4229" stop-opacity="0.08"/><stop offset="0.55" stop-color="#1B4229" stop-opacity="0.75"/><stop offset="1" stop-color="#1B4229" stop-opacity="0.95"/></linearGradient></defs>
<rect x="0" y="0" width="720" height="340" fill="#FFFAEA"/>
<g font-family="'Space Grotesk', system-ui, sans-serif">
<text x="28" y="44" font-size="25" font-weight="700" fill="#1B4229">Olive oil ages in two stages</text>
<text x="28" y="68" font-size="14" fill="#1B4229" opacity="0.55">Unopened, in dark glass or a tin, kept cool. Months counted from the harvest.</text>
<rect x="40" y="100" width="213.3" height="58" rx="4" fill="#CDDB2D" fill-opacity="0.85"/>
<rect x="256.3" y="100" width="210.39999999999998" height="58" rx="4" fill="#9DAE84" fill-opacity="0.5"/>
<rect x="469.7" y="100" width="210.3" height="58" rx="4" fill="url(#rancid)"/>
<text x="54" y="136" font-size="17" font-weight="700" fill="#1B4229">At its best</text>
<text x="270.3" y="136" font-size="17" font-weight="700" fill="#1B4229">Past its best</text>
<text x="666" y="136" text-anchor="end" font-size="17" font-weight="700" fill="#FFFAEA">Rancid</text>
<line x1="40" y1="162" x2="40" y2="168" stroke="#1B4229" opacity="0.4"/>
<text x="40" y="184" text-anchor="start" font-size="12" fill="#1B4229" opacity="0.6">Harvest</text>
<line x1="146.7" y1="162" x2="146.7" y2="168" stroke="#1B4229" opacity="0.4"/>
<text x="146.7" y="184" text-anchor="middle" font-size="12" fill="#1B4229" opacity="0.6">6</text>
<line x1="253.3" y1="162" x2="253.3" y2="168" stroke="#1B4229" opacity="0.4"/>
<text x="253.3" y="184" text-anchor="middle" font-size="12" fill="#1B4229" opacity="0.6">12 months</text>
<line x1="360" y1="162" x2="360" y2="168" stroke="#1B4229" opacity="0.4"/>
<text x="360" y="184" text-anchor="middle" font-size="12" fill="#1B4229" opacity="0.6">18</text>
<line x1="466.7" y1="162" x2="466.7" y2="168" stroke="#1B4229" opacity="0.4"/>
<text x="466.7" y="184" text-anchor="middle" font-size="12" fill="#1B4229" opacity="0.6">24 months</text>
<line x1="573.3" y1="162" x2="573.3" y2="168" stroke="#1B4229" opacity="0.4"/>
<text x="573.3" y="184" text-anchor="middle" font-size="12" fill="#1B4229" opacity="0.6">30</text>
<line x1="680" y1="162" x2="680" y2="168" stroke="#1B4229" opacity="0.4"/>
<text x="680" y="184" text-anchor="end" font-size="12" fill="#1B4229" opacity="0.6">36+</text>
<text x="54" y="220" font-size="13" fill="#1B4229" opacity="0.9">Fresh, bitter and peppery</text>
<text x="54" y="240" font-size="13" fill="#1B4229" opacity="0.65">Polyphenols at their peak</text>
<text x="270.3" y="220" font-size="13" fill="#1B4229" opacity="0.9">Safe to eat and cook with</text>
<text x="270.3" y="240" font-size="13" fill="#1B4229" opacity="0.65">Flatter, fewer polyphenols</text>
<text x="483.7" y="220" font-size="13" fill="#1B4229" opacity="0.9">Smells of crayons or putty</text>
<text x="483.7" y="240" font-size="13" fill="#1B4229" opacity="0.65">Better thrown away</text>
<text x="28" y="306" font-size="11" fill="#1B4229" opacity="0.45">Rancidity has no fixed date: heat, light and air bring it forward. Opened bottles are best within one to two months.</text>
<text x="28" y="322" font-size="11" fill="#1B4229" opacity="0.45">attimo-oil.com</text>
</g>
</svg>