<svg viewBox="0 0 720 320" width="720" height="320" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="ttl desc">
<title id="ttl">Three intensities, all high-polyphenol</title>
<desc id="desc">A bitterness and pungency scale from gentle to bold. Nocellara is gentlest (400 mg/kg), Picual is in the middle (675 mg/kg), Coratina is boldest (847 mg/kg). All three are above the high-polyphenol line.</desc>
<rect x="0" y="0" width="720" height="320" fill="#FFFAEA"/>
<text x="28" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-size="27" font-weight="700" fill="#1B4229">Three intensities, one promise</text>
<text x="28" y="68" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" fill="#1B4229" opacity="0.55">Where each oil sits on bitterness &amp; pungency — all still high-polyphenol</text>

<line x1="96" y1="180" x2="656" y2="180" stroke="#1B4229" stroke-width="3" opacity="0.18" stroke-linecap="round"/>
<text x="96" y="232" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1B4229" opacity="0.6">GENTLE &amp; FRUITY</text>
<text x="656" y="232" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1B4229" opacity="0.6" text-anchor="end">BOLD &amp; PUNCHY</text>

<g font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">
<text x="230" y="150" font-size="16" font-weight="600" fill="#1B4229">Nocellara</text>
<circle cx="230" cy="180" r="11" fill="#B3E58C" stroke="#1B4229" stroke-width="1.5"/>
<text x="230" y="206" font-size="13" font-weight="700" fill="#1B4229">400 mg/kg</text>

<text x="412" y="150" font-size="16" font-weight="600" fill="#1B4229">Picual</text>
<circle cx="412" cy="180" r="11" fill="#CDDB2D" stroke="#1B4229" stroke-width="1.5"/>
<text x="412" y="206" font-size="13" font-weight="700" fill="#1B4229">675 mg/kg</text>

<text x="585" y="150" font-size="16" font-weight="600" fill="#1B4229">Coratina</text>
<circle cx="585" cy="180" r="11" fill="#1B4229"/>
<text x="585" y="206" font-size="13" font-weight="700" fill="#1B4229">847 mg/kg</text>
</g>

<text x="360" y="284" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13.5" fill="#1B4229" opacity="0.7" text-anchor="middle">All three clear the 400 mg/kg high-polyphenol line — choosing is about taste, not quality.</text>
<text x="28" y="306" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1B4229" opacity="0.45">Flavour positions are descriptive · polyphenols from 2025 harvest selection</text>
</svg>
