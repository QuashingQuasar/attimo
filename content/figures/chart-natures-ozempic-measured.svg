<svg viewBox="0 0 720 380" width="720" height="380" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="ttl desc">
<title id="ttl">"Nature's Ozempic", measured</title>
<desc id="desc">Horizontal bar chart of measured weight loss. Semaglutide over 68 weeks: about 15 kilograms. Berberine across pooled trials: one to two kilograms. Olive oil against soybean oil over nine weeks in dieting women: about one extra kilogram.</desc>
<rect x="0" y="0" width="720" height="380" fill="#FFFAEA"/>
<g font-family="'Space Grotesk', system-ui, sans-serif">
<text x="28" y="44" font-size="27" font-weight="700" fill="#1B4229">&#8220;Nature&#8217;s Ozempic&#8221;, measured</text>
<text x="28" y="68" font-size="14" fill="#1B4229" opacity="0.55">Weight loss in the strongest trial of each — the drug against the foods that carried its name</text>

<line x1="268" y1="260" x2="640" y2="260" stroke="#1B4229" stroke-width="1" opacity="0.25"/>
<text x="268.0" y="278" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">0</text>
<text x="392.0" y="278" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">5</text>
<text x="516.0" y="278" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">10</text>
<text x="640.0" y="278" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">15</text>
<text x="454" y="300" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">kilograms lost</text>

<rect x="268" y="104" width="372.0" height="26" rx="4" fill="#1B4229"/>
<text x="253" y="122" font-size="13"  fill="#1B4229" opacity="0.75" text-anchor="end">Semaglutide (Ozempic) · 68 weeks</text>
<text x="650.0" y="122" font-size="13" font-weight="700" fill="#1B4229" opacity="0.8">~15 kg</text>
<rect x="268" y="158" width="37.2" height="26" rx="4" fill="#9DAE84"/>
<text x="253" y="176" font-size="13"  fill="#1B4229" opacity="0.75" text-anchor="end">Berberine · pooled trials</text>
<text x="315.2" y="176" font-size="13" font-weight="700" fill="#1B4229" opacity="0.8">1–2 kg</text>
<rect x="268" y="212" width="24.8" height="26" rx="4" fill="#CDDB2D"/>
<text x="253" y="230" font-size="13" font-weight="600" fill="#1B4229" opacity="1" text-anchor="end">Olive oil · 9 weeks, dieting women</text>
<text x="302.8" y="230" font-size="13" font-weight="700" fill="#1B4229" opacity="0.8">~1 kg extra</text>

<text x="28" y="346" font-size="11" fill="#1B4229" opacity="0.45">Each bar comes from its own trial, with its own duration and design.</text>
<text x="28" y="362" font-size="11" fill="#1B4229" opacity="0.45">attimo-oil.com · sources: STEP 1 (NEJM 2021); Asbaghi 2020; Galv&#227;o C&#226;ndido 2018</text>
</g>
</svg>