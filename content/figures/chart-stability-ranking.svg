<svg viewBox="0 0 720 516" width="720" height="516" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="t d">
<title id="t">Cooking fats ranked by oxidative stability</title>
<desc id="d">Bar chart ranking nine cooking fats by oxidative stability, most stable at the top. Each row also lists the fat's smoke point in small grey type. Read top to bottom, the smoke points appear in no particular order, showing that smoke point does not follow stability.</desc>
<rect width="720" height="516" fill="#FFFAEA"/>
<g font-family="'Space Grotesk', system-ui, sans-serif">
<text x="28" y="44" font-size="26" font-weight="700" fill="#1B4229">Cooking fats ranked by oxidative stability</text>
<text x="28" y="68" font-size="12" fill="#1B4229" opacity="0.6"><tspan font-weight="700">Oxidative stability</tspan>: how long the fat resists breaking down under sustained heat.</text>
<text x="28" y="84" font-size="12" fill="#1B4229" opacity="0.6"><tspan font-weight="700">Smoke point</tspan>: the temperature past which the oil starts breaking down rapidly, visible as smoke.</text>
<text x="28" y="110" font-size="14" fill="#1B4229" opacity="0.55">Fats can start breaking down long before they start smoking. So while smoke point is a signal,</text>
<text x="28" y="128" font-size="14" fill="#1B4229" opacity="0.55">it doesn't correlate well with actual oxidative stability.</text>

<text x="215" y="158" font-size="11" font-weight="700" letter-spacing="2" fill="#1B4229" opacity="0.85">OXIDATIVE STABILITY</text>
<text x="668" y="158" font-size="11" font-weight="700" letter-spacing="2" fill="#1B4229" opacity="0.45" text-anchor="end">SMOKE POINT</text>

<text x="205" y="187" font-size="13"  fill="#1B4229" opacity="0.85" text-anchor="end">Coconut oil</text>
<rect x="215" y="176" width="390.0" height="14" rx="3" fill="#9DAE84" fill-opacity="0.75"/>
<text x="668" y="187" font-size="12" fill="#1B4229" opacity="0.45" text-anchor="end">177°C</text>
<text x="205" y="218" font-size="13" font-weight="700" fill="#1B4229"  text-anchor="end">Extra virgin olive oil</text>
<rect x="215" y="207" width="358.8" height="14" rx="3" fill="#CDDB2D" stroke="#1B4229" stroke-width="1.4"/>
<text x="668" y="218" font-size="12" fill="#1B4229" opacity="0.45" text-anchor="end">195°C</text>
<text x="205" y="249" font-size="13"  fill="#1B4229" opacity="0.85" text-anchor="end">Avocado oil</text>
<rect x="215" y="238" width="312.0" height="14" rx="3" fill="#9DAE84" fill-opacity="0.75"/>
<text x="668" y="249" font-size="12" fill="#1B4229" opacity="0.45" text-anchor="end">250°C</text>
<text x="205" y="280" font-size="13"  fill="#1B4229" opacity="0.85" text-anchor="end">Butter</text>
<rect x="215" y="269" width="304.2" height="14" rx="3" fill="#9DAE84" fill-opacity="0.75"/>
<text x="668" y="280" font-size="12" fill="#1B4229" opacity="0.45" text-anchor="end">175°C</text>
<text x="205" y="311" font-size="13"  fill="#1B4229" opacity="0.85" text-anchor="end">Rapeseed oil</text>
<rect x="215" y="300" width="234.0" height="14" rx="3" fill="#9DAE84" fill-opacity="0.75"/>
<text x="668" y="311" font-size="12" fill="#1B4229" opacity="0.45" text-anchor="end">205°C</text>
<text x="205" y="342" font-size="13"  fill="#1B4229" opacity="0.85" text-anchor="end">Corn oil</text>
<rect x="215" y="331" width="167.7" height="14" rx="3" fill="#9DAE84" fill-opacity="0.75"/>
<text x="668" y="342" font-size="12" fill="#1B4229" opacity="0.45" text-anchor="end">232°C</text>
<text x="205" y="373" font-size="13"  fill="#1B4229" opacity="0.85" text-anchor="end">Sunflower oil</text>
<rect x="215" y="362" width="156.0" height="14" rx="3" fill="#9DAE84" fill-opacity="0.75"/>
<text x="668" y="373" font-size="12" fill="#1B4229" opacity="0.45" text-anchor="end">225°C</text>
<text x="205" y="404" font-size="13"  fill="#1B4229" opacity="0.85" text-anchor="end">Soybean oil</text>
<rect x="215" y="393" width="144.3" height="14" rx="3" fill="#9DAE84" fill-opacity="0.75"/>
<text x="668" y="404" font-size="12" fill="#1B4229" opacity="0.45" text-anchor="end">238°C</text>
<text x="205" y="435" font-size="13"  fill="#1B4229" opacity="0.85" text-anchor="end">Grapeseed oil</text>
<rect x="215" y="424" width="85.8" height="14" rx="3" fill="#9DAE84" fill-opacity="0.75"/>
<text x="668" y="435" font-size="12" fill="#1B4229" opacity="0.45" text-anchor="end">216°C</text>
<line x1="293.0" y1="168" x2="293.0" y2="451" stroke="#1B4229" stroke-width="1" opacity="0.07"/>
<text x="293.0" y="469" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">very low</text>
<line x1="371.0" y1="168" x2="371.0" y2="451" stroke="#1B4229" stroke-width="1" opacity="0.07"/>
<text x="371.0" y="469" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">low</text>
<line x1="449.0" y1="168" x2="449.0" y2="451" stroke="#1B4229" stroke-width="1" opacity="0.07"/>
<text x="449.0" y="469" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">moderate</text>
<line x1="527.0" y1="168" x2="527.0" y2="451" stroke="#1B4229" stroke-width="1" opacity="0.07"/>
<text x="527.0" y="469" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">high</text>
<line x1="605.0" y1="168" x2="605.0" y2="451" stroke="#1B4229" stroke-width="1" opacity="0.07"/>
<text x="605.0" y="469" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">very high</text>

<text x="28" y="498" font-size="11" fill="#1B4229" opacity="0.45">attimo-oil.com</text>
</g>
</svg>