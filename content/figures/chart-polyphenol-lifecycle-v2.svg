<svg viewBox="0 0 720 420" width="720" height="420" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="ttl desc">
<title id="ttl">Polyphenols fade after pressing</title>
<desc id="desc">Polyphenols at pressing and after 12 months in the dark at 20 °C, at the 42% average loss measured across 160 extra virgin olive oils. An early-harvest oil tested at 847 mg/kg keeps about 491, still above the 400 high-polyphenol line. A supermarket oil starting near 200 ends near 116, below the 250 mg/kg level of the EU health claim throughout.</desc>
<rect x="0" y="0" width="720" height="420" fill="#FFFAEA"/>
<g font-family="'Space Grotesk', system-ui, sans-serif">
<text x="28" y="44" font-size="25" font-weight="700" fill="#1B4229">Polyphenols fade after pressing</text>
<text x="28" y="68" font-size="14" fill="#1B4229" opacity="0.55">mg/kg at pressing and after 12 months in the dark at 20 °C, at the average loss of 42%</text>
<line x1="120" y1="222.2" x2="690" y2="222.2" stroke="#CDDB2D" stroke-width="2" stroke-dasharray="6 4"/>
<text x="690" y="216.2" text-anchor="end" font-size="11" fill="#1B4229" opacity="0.6">high-polyphenol (400)</text>
<line x1="120" y1="258.9" x2="690" y2="258.9" stroke="#1B4229" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.5"/>
<text x="690" y="252.89999999999998" text-anchor="end" font-size="11" fill="#1B4229" opacity="0.6">EU health claim (250)</text>
<line x1="200" y1="113" x2="470" y2="200" stroke="#1B4229" stroke-width="3"/>
<circle cx="200" cy="113" r="5" fill="#1B4229"/><circle cx="470" cy="200" r="5" fill="#1B4229"/>
<text x="186" y="118" text-anchor="end" font-size="15" font-weight="700" fill="#1B4229">847</text>
<text x="484" y="205" font-size="15" font-weight="700" fill="#1B4229">491<tspan font-weight="400" font-size="13" opacity="0.7" dx="8">early harvest, fresh-pressed</tspan></text>
<line x1="200" y1="271.1" x2="470" y2="291.6" stroke="#9DAE84" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="200" cy="271.1" r="5" fill="#9DAE84"/><circle cx="470" cy="291.6" r="5" fill="#9DAE84"/>
<text x="186" y="276.1" text-anchor="end" font-size="15" font-weight="700" fill="#1B4229">200</text>
<text x="484" y="296.6" font-size="15" font-weight="700" fill="#1B4229">116<tspan font-weight="400" font-size="13" opacity="0.7" dx="8">supermarket, late harvest</tspan></text>
<text x="200" y="342" text-anchor="middle" font-size="13" fill="#1B4229" opacity="0.7">At pressing</text>
<text x="470" y="342" text-anchor="middle" font-size="13" fill="#1B4229" opacity="0.7">12 months later</text>
<text x="28" y="370" font-size="11" fill="#1B4229" opacity="0.45">Start values: Attimo Coratina 25/26 lab test (847 mg/kg); the supermarket start of 200 is illustrative.</text>
<text x="28" y="386" font-size="11" fill="#1B4229" opacity="0.45">Loss: average of 160 oils over 12 months (Castillo-Luna et al., 2021). Individual oils varied by about 24 points.</text>
<text x="28" y="402" font-size="11" fill="#1B4229" opacity="0.45">attimo-oil.com</text>
</g>
</svg>