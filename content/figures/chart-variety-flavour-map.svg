<svg viewBox="0 0 720 620" width="720" height="620" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="t d">
<title id="t">How olive varieties taste</title>
<desc id="d">Map of fourteen olive varieties. Left to right runs from mild to bitter and peppery; bottom to top runs from ripe fruit flavours to green ones. Coratina, Chetoui and Koroneiki sit top right; Arbequina, Galega and Leccino sit bottom left; Nocellara sits near the centre.</desc>
<rect width="720" height="620" fill="#FFFAEA"/>
<g font-family="'Space Grotesk', system-ui, sans-serif">
<text x="28" y="44" font-size="26" font-weight="700" fill="#1B4229">How olive varieties taste</text>
<text x="28" y="72" font-size="14" fill="#1B4229" opacity="0.6">Bitterness and pepper come from polyphenols, so the further right a variety sits,</text>
<text x="28" y="90" font-size="14" fill="#1B4229" opacity="0.6">the more polyphenols its oil tends to carry. Positions are approximate, for early-harvest oil.</text>
<line x1="80" y1="560" x2="680" y2="560" stroke="#1B4229" stroke-width="1" opacity="0.25"/>
<line x1="80" y1="125" x2="80" y2="560" stroke="#1B4229" stroke-width="1" opacity="0.25"/>
<line x1="380" y1="125" x2="380" y2="560" stroke="#1B4229" stroke-width="1" opacity="0.07"/>
<line x1="80" y1="342.5" x2="680" y2="342.5" stroke="#1B4229" stroke-width="1" opacity="0.07"/>
<text x="80" y="584" font-size="11" font-weight="700" letter-spacing="2" fill="#1B4229" opacity="0.55">MILD</text>
<text x="680" y="584" font-size="11" font-weight="700" letter-spacing="2" fill="#1B4229" opacity="0.55" text-anchor="end">BITTER AND PEPPERY</text>
<text x="66" y="560" font-size="11" font-weight="700" letter-spacing="2" fill="#1B4229" opacity="0.55" transform="rotate(-90 66 560)">RIPE FRUIT, ALMOND</text>
<text x="66" y="125" font-size="11" font-weight="700" letter-spacing="2" fill="#1B4229" opacity="0.55" text-anchor="end" transform="rotate(-90 66 125)">GRASS, LEAF, ARTICHOKE</text>
