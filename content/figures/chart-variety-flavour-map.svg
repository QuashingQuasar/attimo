<text x="170.0" y="494.4" font-size="13"  fill="#1B4229" text-anchor="start">Galega<tspan font-size="11" opacity="0.5" font-weight="400"> Portugal</tspan></text>
<circle cx="122.0" cy="429.5" r="6" fill="#9DAE84" fill-opacity="0.85"/>
<text x="134.0" y="433.5" font-size="13"  fill="#1B4229" text-anchor="start">Arbequina<tspan font-size="11" opacity="0.5" font-weight="400"> Spain</tspan></text>
<text x="28" y="602" font-size="11" fill="#1B4229" opacity="0.45">attimo-oil.com</text>
