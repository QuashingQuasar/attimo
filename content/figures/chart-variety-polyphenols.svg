<rect x="262" y="424" width="114.8" height="14" rx="3" fill="#CDDB2D" stroke="#1B4229" stroke-width="1.4"/>
<text x="384.8" y="435" font-size="12" font-weight="700" fill="#1B4229">675<tspan font-weight="400" opacity="0.5"> Folin</tspan></text>
<text x="250" y="465" font-size="13"  fill="#1B4229" text-anchor="end">Ottobratica<tspan font-size="11" opacity="0.55" font-weight="400"> · Deliba</tspan></text>
<rect x="262" y="454" width="106.9" height="14" rx="3" fill="#9DAE84" fill-opacity="0.75"/>
<text x="376.9" y="465" font-size="12" font-weight="700" fill="#1B4229">629<tspan font-weight="400" opacity="0.5"> HPLC</tspan></text>
<text x="250" y="495" font-size="13" font-weight="700" fill="#1B4229" text-anchor="end">Nocellara<tspan font-size="11" opacity="0.55" font-weight="400"> · ATTIMO</tspan></text>
<rect x="262" y="484" width="68.0" height="14" rx="3" fill="#CDDB2D" stroke="#1B4229" stroke-width="1.4"/>
<text x="338.0" y="495" font-size="12" font-weight="700" fill="#1B4229">400<tspan font-weight="400" opacity="0.5"> HPLC</tspan></text>
<text x="28" y="562" font-size="11" fill="#1B4229" opacity="0.45">Source: Olive Oil Polyphenol Index, attimo-oil.com/polyphenol-index</text>
