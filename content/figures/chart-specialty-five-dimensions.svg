<svg viewBox="0 0 720 470" width="720" height="470" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="t1 d1">
<title id="t1">The five dimensions of specialty olive oil, against commodity practice</title>
<desc id="d1">Table with five rows — variety, harvest window, freshness, origin, transparency — and two columns. The commodity column reads: a dozen anonymous varieties blended; late harvest for yield; days in crates and a two-year best-before; Product of Italy meaning bottled in Italy; no analysis published. The specialty column reads: one named cultivar or a blend that names its parts; early October harvest; milled within hours and one harvest on sale; grove, region and mill named; lab analysis published with the harvest date on the label.</desc>
<rect width="720" height="470" fill="#FFFAEA"/>
<g font-family="'Space Grotesk', system-ui, sans-serif">
<text x="28" y="44" font-size="26" font-weight="700" fill="#1B4229">Five decisions separate specialty from commodity</text>
<text x="28" y="68" font-size="14" fill="#1B4229" opacity="0.55">Each practice reverses a commodity one, and each can be checked from the label or the website</text>
<text x="190" y="104" font-size="11" font-weight="700" letter-spacing="2" fill="#1B4229" opacity="0.55">COMMODITY OIL</text>
<text x="470" y="104" font-size="11" font-weight="700" letter-spacing="2" fill="#1B4229">SPECIALTY OIL</text>
<line x1="28" y1="120" x2="692" y2="120" stroke="#1B4229" stroke-width="1" stroke-dasharray="3 4" opacity="0"/>
<text x="28" y="140" font-size="12" font-weight="700" fill="#1B4229" opacity="0.5">1</text>
<text x="46" y="140" font-size="15" font-weight="700" fill="#1B4229">Variety</text>
<text x="190" y="136" font-size="13" fill="#1B4229" opacity="0.7">a dozen anonymous varieties,</text>
<text x="190" y="154" font-size="13" fill="#1B4229" opacity="0.7">blended to taste the same</text>
<rect x="456" y="120" width="236" height="60" fill="#B3E58C" opacity="0.28"/>
<text x="470" y="136" font-size="13" font-weight="600" fill="#1B4229">one named cultivar, or a blend</text>
<text x="470" y="154" font-size="13" font-weight="600" fill="#1B4229">that names its parts</text>
<line x1="28" y1="180" x2="692" y2="180" stroke="#1B4229" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>
<text x="28" y="200" font-size="12" font-weight="700" fill="#1B4229" opacity="0.5">2</text>
<text x="46" y="200" font-size="15" font-weight="700" fill="#1B4229">Harvest window</text>
<text x="190" y="196" font-size="13" fill="#1B4229" opacity="0.7">late — a ripe olive gives</text>
<text x="190" y="214" font-size="13" fill="#1B4229" opacity="0.7">up to twice the oil</text>
<rect x="456" y="180" width="236" height="60" fill="#B3E58C" opacity="0.28"/>
<text x="470" y="196" font-size="13" font-weight="600" fill="#1B4229">early, October — less oil,</text>
<text x="470" y="214" font-size="13" font-weight="600" fill="#1B4229">dense with polyphenols</text>
<line x1="28" y1="240" x2="692" y2="240" stroke="#1B4229" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>
<text x="28" y="260" font-size="12" font-weight="700" fill="#1B4229" opacity="0.5">3</text>
<text x="46" y="260" font-size="15" font-weight="700" fill="#1B4229">Freshness</text>
<text x="190" y="256" font-size="13" fill="#1B4229" opacity="0.7">days in crates; a two-year</text>
<text x="190" y="274" font-size="13" fill="#1B4229" opacity="0.7">best-before window</text>
<rect x="456" y="240" width="236" height="60" fill="#B3E58C" opacity="0.28"/>
<text x="470" y="256" font-size="13" font-weight="600" fill="#1B4229">milled within hours; one</text>
<text x="470" y="274" font-size="13" font-weight="600" fill="#1B4229">harvest on sale, then none</text>
<line x1="28" y1="300" x2="692" y2="300" stroke="#1B4229" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>
<text x="28" y="320" font-size="12" font-weight="700" fill="#1B4229" opacity="0.5">4</text>
<text x="46" y="320" font-size="15" font-weight="700" fill="#1B4229">Origin</text>
<text x="190" y="316" font-size="13" fill="#1B4229" opacity="0.7">“Product of Italy” — where</text>
<text x="190" y="334" font-size="13" fill="#1B4229" opacity="0.7">the oil was bottled</text>
<rect x="456" y="300" width="236" height="60" fill="#B3E58C" opacity="0.28"/>
<text x="470" y="316" font-size="13" font-weight="600" fill="#1B4229">grove, region and mill</text>
<text x="470" y="334" font-size="13" font-weight="600" fill="#1B4229">named</text>
<line x1="28" y1="360" x2="692" y2="360" stroke="#1B4229" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>
<text x="28" y="380" font-size="12" font-weight="700" fill="#1B4229" opacity="0.5">5</text>
<text x="46" y="380" font-size="15" font-weight="700" fill="#1B4229">Transparency</text>
<text x="190" y="376" font-size="13" fill="#1B4229" opacity="0.7">no analysis published;</text>
<text x="190" y="394" font-size="13" fill="#1B4229" opacity="0.7">numbers serve no purpose</text>
<rect x="456" y="360" width="236" height="60" fill="#B3E58C" opacity="0.28"/>
<text x="470" y="376" font-size="13" font-weight="600" fill="#1B4229">lab analysis published,</text>
<text x="470" y="394" font-size="13" font-weight="600" fill="#1B4229">harvest date on the label</text>
<text x="28" y="452" font-size="11" fill="#1B4229" opacity="0.45">attimo-oil.com</text>
</g>
</svg>