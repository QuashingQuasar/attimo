<text x="177.0" y="136.0" font-size="12.5"  fill="#1B4229" opacity="0.8" text-anchor="end">Coconut oil</text>
<circle cx="177.1" cy="192.0" r="6" fill="#9DAE84" stroke="#1B4229" stroke-width="1.4"/>
<text x="167.1" y="196.0" font-size="12.5"  fill="#1B4229" opacity="0.8" text-anchor="end">Butter</text>
<circle cx="339.4" cy="252.0" r="6" fill="#9DAE84" stroke="#1B4229" stroke-width="1.4"/>
<text x="349.4" y="256.0" font-size="12.5"  fill="#1B4229" opacity="0.8" text-anchor="start">Rapeseed oil</text>
<circle cx="398.9" cy="366.0" r="6" fill="#9DAE84" stroke="#1B4229" stroke-width="1.4"/>
<text x="398.9" y="384.0" font-size="12.5"  fill="#1B4229" opacity="0.8" text-anchor="middle">Grapeseed oil</text>
<circle cx="447.6" cy="312.0" r="6" fill="#9DAE84" stroke="#1B4229" stroke-width="1.4"/>
<text x="437.6" y="316.0" font-size="12.5"  fill="#1B4229" opacity="0.8" text-anchor="end">Sunflower oil</text>
<circle cx="485.5" cy="303.0" r="6" fill="#9DAE84" stroke="#1B4229" stroke-width="1.4"/>
<text x="485.5" y="291.0" font-size="12.5"  fill="#1B4229" opacity="0.8" text-anchor="middle">Corn oil</text>
<circle cx="517.9" cy="321.0" r="6" fill="#9DAE84" stroke="#1B4229" stroke-width="1.4"/>
<text x="527.9" y="329.0" font-size="12.5"  fill="#1B4229" opacity="0.8" text-anchor="start">Soybean oil</text>

<text x="28" y="482" font-size="11" fill="#1B4229" opacity="0.45">Typical published values; smoke points vary with refining and free acidity.</text>
<text x="28" y="498" font-size="11" fill="#1B4229" opacity="0.45">Stability reflects fat composition and antioxidant content.</text>
<text x="28" y="514" font-size="11" fill="#1B4229" opacity="0.45">attimo-oil.com</text>
</g>
</svg>