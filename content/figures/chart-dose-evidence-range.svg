<svg viewBox="0 0 720 320" width="720" height="320" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="ttl2 desc2">
<title id="ttl2">Where the evidence stops</title>
<desc id="desc2">A scale of daily olive oil intake from 0 to 55 grams. Benefit becomes visible at 7 grams (half a tablespoon) and plateaus at about 20 grams (one and a half tablespoons); this range is marked as supported by evidence. Beyond 20 grams the range is unmeasured, and includes Bryan Johnson's intake at 41 grams and the PREDIMED trial arm at 50 grams.</desc>
<rect x="0" y="0" width="720" height="320" fill="#FFFAEA"/>
<text x="28" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-size="27" font-weight="700" fill="#1B4229">Where the evidence stops</text>
<text x="28" y="68" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" fill="#1B4229" opacity="0.55">Daily olive oil intake, and how far the research reaches</text>

<rect x="60" y="108" width="218" height="42" rx="4" fill="#B3E58C"/>
<rect x="278" y="108" width="382" height="42" rx="4" fill="#9DAE84" opacity="0.32"/>
<text x="169" y="134" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1B4229" text-anchor="middle">Measured benefit</text>
<text x="469" y="134" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1B4229" opacity="0.6" text-anchor="middle">Beyond the measured range</text>

<g stroke="#1B4229" stroke-width="1.5">
<line x1="136" y1="102" x2="136" y2="164" opacity="0.75"/>
<line x1="278" y1="98" x2="278" y2="168" opacity="0.9"/>
<line x1="507" y1="102" x2="507" y2="164" opacity="0.45"/>
<line x1="605" y1="102" x2="605" y2="164" opacity="0.45"/>
</g>

<g font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">
<text x="136" y="190" font-size="15" font-weight="700" fill="#1B4229">7 g</text>
<text x="136" y="208" font-size="11" fill="#1B4229" opacity="0.6">½ tbsp · benefit visible</text>

<text x="278" y="190" font-size="15" font-weight="700" fill="#1B4229">20 g</text>
<text x="278" y="208" font-size="11" fill="#1B4229" opacity="0.6">1½ tbsp · plateau</text>

<text x="507" y="190" font-size="15" font-weight="700" fill="#1B4229" opacity="0.65">41 g</text>
<text x="507" y="208" font-size="11" fill="#1B4229" opacity="0.5">Bryan Johnson</text>

<text x="605" y="190" font-size="15" font-weight="700" fill="#1B4229" opacity="0.65">50 g</text>
<text x="605" y="208" font-size="11" fill="#1B4229" opacity="0.5">PREDIMED arm</text>
</g>

<line x1="60" y1="240" x2="660" y2="240" stroke="#1B4229" stroke-width="1" opacity="0.25"/>
<g font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">
<text x="60" y="258">0</text>
<text x="169" y="258">10</text>
<text x="278" y="258">20</text>
<text x="387" y="258">30</text>
<text x="496" y="258">40</text>
<text x="605" y="258">50</text>
</g>
<text x="360" y="280" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">grams of olive oil per day</text>

<text x="28" y="306" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#1B4229" opacity="0.45">Cohort benefit is visible from ~7 g and flattens near 20 g. No study has found harm above it — none has measured it either.</text>
</svg>
