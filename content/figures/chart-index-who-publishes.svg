<svg viewBox="0 0 720 680" width="720" height="680" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="t3 d3">
<title id="t3">Who publishes what</title>
<desc id="d3">Matrix of fifteen brands against four columns: total published, oleocanthal published, oleacein published, lab report viewable. The eight ranked brands publish oleocanthal and oleacein with a viewable report (Laconiko publishes oleocanthal only). Seven further brands state a total only; of those, Oro del Desierto and Blueprint make the report viewable, the rest do not.</desc>
<rect width="720" height="680" fill="#FFFAEA"/>
<g font-family="'Space Grotesk', system-ui, sans-serif">
<text x="28" y="44" font-size="25" font-weight="700" fill="#1B4229">Who publishes what</text>
<text x="28" y="68" font-size="13" fill="#1B4229" opacity="0.6">A brand enters the ranked index when it publishes oleocanthal and oleacein. A viewable report is what</text>
<text x="28" y="86" font-size="13" fill="#1B4229" opacity="0.6">makes any figure checkable; a number in product copy is a claim.</text>
<text x="375.0" y="120" font-size="9.5" font-weight="700" letter-spacing="1" fill="#1B4229" opacity="0.7" text-anchor="middle">TOTAL</text>
<text x="465.0" y="120" font-size="9.5" font-weight="700" letter-spacing="1" fill="#1B4229" opacity="0.7" text-anchor="middle">OLEOCANTHAL</text>
