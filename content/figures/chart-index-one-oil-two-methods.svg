<svg viewBox="0 0 720 400" width="720" height="400" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="t2 d2">
<title id="t2">One oil, two certificates: the totals land 23% apart</title>
<desc id="d2">Paired bars for Olivea's 2025 Olympia oil, analysed by NMR and by HPLC. Total polyphenols 1,046 by NMR against 850 by HPLC; oleocanthal 244 against 143; oleacein 175 against 185. Same bottle, two laboratories, two sets of numbers.</desc>
<rect width="720" height="400" fill="#FFFAEA"/>
<g font-family="'Space Grotesk', system-ui, sans-serif">
<text x="28" y="44" font-size="25" font-weight="700" fill="#1B4229">One oil, two certificates: the totals land 23% apart</text>
<text x="28" y="68" font-size="13" fill="#1B4229" opacity="0.6">Olivea's 2025 Olympia oil, analysed by the University of Athens (NMR) and by an IOC-method laboratory (HPLC).</text>
<text x="28" y="86" font-size="13" fill="#1B4229" opacity="0.6">Olivea publishes both. Most brands publish one, and the reader never learns which currency it is in.</text>
<text x="156" y="144" font-size="13" font-weight="700" fill="#1B4229" text-anchor="end">Total polyphenols</text>
<rect x="170" y="120" width="399.4" height="20" rx="3" fill="#9DAE84" fill-opacity="0.8"/>
<text x="577.4" y="134" font-size="12" font-weight="700" fill="#1B4229">1,046</text>
<text x="619.4" y="134" font-size="10" fill="#1B4229" opacity="0.5">NMR</text>
<rect x="170" y="146" width="324.5" height="20" rx="3" fill="#1B4229"/>
<text x="502.5" y="160" font-size="12" font-weight="700" fill="#1B4229">850</text>
<text x="534.5" y="160" font-size="10" fill="#1B4229" opacity="0.5">HPLC</text>
<text x="156" y="220" font-size="13" font-weight="700" fill="#1B4229" text-anchor="end">Oleocanthal</text>
<rect x="170" y="196" width="93.2" height="20" rx="3" fill="#9DAE84" fill-opacity="0.8"/>
<text x="271.2" y="210" font-size="12" font-weight="700" fill="#1B4229">244</text>
<text x="303.2" y="210" font-size="10" fill="#1B4229" opacity="0.5">NMR</text>
<rect x="170" y="222" width="54.6" height="20" rx="3" fill="#1B4229"/>
<text x="232.6" y="236" font-size="12" font-weight="700" fill="#1B4229">143</text>
<text x="264.6" y="236" font-size="10" fill="#1B4229" opacity="0.5">HPLC</text>
<text x="156" y="296" font-size="13" font-weight="700" fill="#1B4229" text-anchor="end">Oleacein</text>
<rect x="170" y="272" width="66.8" height="20" rx="3" fill="#9DAE84" fill-opacity="0.8"/>
<text x="244.8" y="286" font-size="12" font-weight="700" fill="#1B4229">175</text>
<text x="276.8" y="286" font-size="10" fill="#1B4229" opacity="0.5">NMR</text>
<rect x="170" y="298" width="70.6" height="20" rx="3" fill="#1B4229"/>
<text x="248.6" y="312" font-size="12" font-weight="700" fill="#1B4229">185</text>
<text x="280.6" y="312" font-size="10" fill="#1B4229" opacity="0.5">HPLC</text>
<text x="28" y="366" font-size="11" fill="#1B4229" opacity="0.45">mg/kg. Source: Olivea's published lab results page, both certificates, 2025 harvest.</text>
<text x="28" y="382" font-size="11" fill="#1B4229" opacity="0.45">attimo-oil.com</text>
</g>
</svg>