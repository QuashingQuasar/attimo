<svg viewBox="0 0 720 430" width="720" height="430" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="ttl desc">
<title id="ttl">The best-before date measures the wrong thing</title>
<desc id="desc">Timeline of 38 months. Freshness starts falling the day the olives are pressed. The oil sits in tanks for months, is bottled at month fourteen, and only then gets a best-before date stamped 18 to 24 months ahead. By the printed date the oil is three years old.</desc>
<rect x="0" y="0" width="720" height="430" fill="#FFFAEA"/>
<g font-family="'Space Grotesk', system-ui, sans-serif">
<text x="28" y="44" font-size="26" font-weight="700" fill="#1B4229">The best-before date measures the wrong thing</text>
<text x="28" y="68" font-size="14" fill="#1B4229" opacity="0.55">It counts 18–24 months from bottling — but the oil starts fading at harvest</text>

<!-- decay area: what's left of the oil -->
<path d="M56,132.0 L72.0,144.1 L88.0,155.4 L104.0,165.8 L120.0,175.4 L136.0,184.4 L152.0,192.6 L168.0,200.3 L184.0,207.4 L200.0,213.9 L216.0,220.0 L232.0,225.6 L248.0,230.8 L264.0,235.7 L280.0,240.1 L296.0,244.3 L312.0,248.1 L328.0,251.6 L344.0,254.9 L360.0,258.0 L376.0,260.8 L392.0,263.4 L408.0,265.8 L424.0,268.0 L440.0,270.1 L456.0,272.0 L472.0,273.8 L488.0,275.4 L504.0,277.0 L520.0,278.4 L536.0,279.7 L552.0,280.9 L568.0,282.0 L584.0,283.0 L600.0,284.0 L616.0,284.9 L632.0,285.7 L648.0,286.5 L664.0,287.2 L664,316 L56,316 Z" fill="#CDDB2D" fill-opacity="0.5"/>
<path d="M56,132.0 L72.0,144.1 L88.0,155.4 L104.0,165.8 L120.0,175.4 L136.0,184.4 L152.0,192.6 L168.0,200.3 L184.0,207.4 L200.0,213.9 L216.0,220.0 L232.0,225.6 L248.0,230.8 L264.0,235.7 L280.0,240.1 L296.0,244.3 L312.0,248.1 L328.0,251.6 L344.0,254.9 L360.0,258.0 L376.0,260.8 L392.0,263.4 L408.0,265.8 L424.0,268.0 L440.0,270.1 L456.0,272.0 L472.0,273.8 L488.0,275.4 L504.0,277.0 L520.0,278.4 L536.0,279.7 L552.0,280.9 L568.0,282.0 L584.0,283.0 L600.0,284.0 L616.0,284.9 L632.0,285.7 L648.0,286.5 L664.0,287.2 " fill="none" stroke="#1B4229" stroke-width="2.2"/>
<text x="72.0" y="260" font-size="13" font-weight="700" fill="#1B4229">aroma &amp; polyphenols left in the oil</text>

<!-- tank storage band -->
<rect x="56" y="302" width="224.0" height="14" fill="#9DAE84" fill-opacity="0.45"/>
<text x="168.0" y="292" font-size="11" fill="#1B4229" opacity="0.65" text-anchor="middle">tank storage, sometimes pooled across harvests</text>

<!-- baseline + ticks -->
<line x1="56" y1="316" x2="664" y2="316" stroke="#1B4229" stroke-width="1" opacity="0.3"/>
<line x1="56.0" y1="316" x2="56.0" y2="321" stroke="#1B4229" stroke-width="1" opacity="0.35"/>
<text x="56.0" y="336" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">harvest</text>
<line x1="152.0" y1="316" x2="152.0" y2="321" stroke="#1B4229" stroke-width="1" opacity="0.35"/>
<text x="152.0" y="336" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">6 mo</text>
<line x1="248.0" y1="316" x2="248.0" y2="321" stroke="#1B4229" stroke-width="1" opacity="0.35"/>
<text x="248.0" y="336" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">12 mo</text>
<line x1="344.0" y1="316" x2="344.0" y2="321" stroke="#1B4229" stroke-width="1" opacity="0.35"/>
<text x="344.0" y="336" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">18 mo</text>
<line x1="440.0" y1="316" x2="440.0" y2="321" stroke="#1B4229" stroke-width="1" opacity="0.35"/>
<text x="440.0" y="336" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">24 mo</text>
<line x1="536.0" y1="316" x2="536.0" y2="321" stroke="#1B4229" stroke-width="1" opacity="0.35"/>
<text x="536.0" y="336" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">30 mo</text>
<line x1="632.0" y1="316" x2="632.0" y2="321" stroke="#1B4229" stroke-width="1" opacity="0.35"/>
<text x="632.0" y="336" font-size="11" fill="#1B4229" opacity="0.5" text-anchor="middle">36 mo</text>

<!-- harvest marker -->
<line x1="56" y1="316" x2="56" y2="124" stroke="#1B4229" stroke-width="1.6" opacity="0.75"/>
<circle cx="56" cy="132.0" r="4.5" fill="#1B4229"/>
<text x="56" y="116" font-size="13" font-weight="700" fill="#1B4229">Harvest — olives pressed, the clock starts</text>

<!-- bottling marker -->
<line x1="280.0" y1="316" x2="280.0" y2="176" stroke="#1B4229" stroke-width="1.6" opacity="0.75" stroke-dasharray="4 3"/>
<circle cx="280.0" cy="240.1" r="4.5" fill="#1B4229"/>
<text x="280.0" y="168" font-size="13" font-weight="700" fill="#1B4229">Bottling — best-before stamped here</text>

<!-- +18-24 months bracket from bottling to best-before -->
<g opacity="0.8">
<line x1="280.0" y1="238" x2="632.0" y2="238" stroke="#1B4229" stroke-width="1.4"/>
<line x1="280.0" y1="232" x2="280.0" y2="244" stroke="#1B4229" stroke-width="1.4"/>
<path d="M624.0,233 L632.0,238 L624.0,243 Z" fill="#1B4229"/>
</g>
<text x="456.0" y="230" font-size="12" font-weight="600" fill="#1B4229" opacity="0.8" text-anchor="middle">+ 18–24 months, fixed window</text>

<!-- best-before marker -->
<line x1="632.0" y1="316" x2="632.0" y2="252" stroke="#1B4229" stroke-width="1.6" opacity="0.75" stroke-dasharray="4 3"/>
<text x="626.0" y="262" font-size="13" font-weight="700" fill="#1B4229" text-anchor="end">"Best before" — the oil is 3 years old</text>

<text x="28" y="396" font-size="11" fill="#1B4229" opacity="0.45">Illustrative timeline for a typical supermarket oil. EU rule: a printed harvest date guarantees every drop is from that harvest.</text>
<text x="28" y="412" font-size="11" fill="#1B4229" opacity="0.45">attimo-oil.com</text>
</g>
</svg>